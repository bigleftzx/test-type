<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中华菜谱系统 - 八大菜系与家常菜</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>🍳 中华菜谱系统</h1>
            <p class="subtitle">传承中华美食文化 · 八大菜系 · 民间家常菜</p>
        </div>
    </header>

    <nav class="main-nav">
        <button class="nav-btn active" data-category="all">全部菜谱</button>
        <button class="nav-btn" data-category="八大菜系">八大菜系</button>
        <button class="nav-btn" data-category="家常菜">民间家常菜</button>
    </nav>

    <div class="container">
        <aside class="sidebar">
            <div class="filter-section">
                <h3>菜系筛选</h3>
                <div id="cuisine-filters">
                    <label class="filter-item">
                        <input type="checkbox" value="鲁菜" data-category="八大菜系"> 鲁菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="川菜" data-category="八大菜系"> 川菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="粤菜" data-category="八大菜系"> 粤菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="苏菜" data-category="八大菜系"> 苏菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="浙菜" data-category="八大菜系"> 浙菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="闽菜" data-category="八大菜系"> 闽菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="湘菜" data-category="八大菜系"> 湘菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="徽菜" data-category="八大菜系"> 徽菜
                    </label>
                    <label class="filter-item">
                        <input type="checkbox" value="家常菜" data-category="家常菜"> 家常菜
                    </label>
                </div>
            </div>

            <div class="search-section">
                <h3>搜索菜谱</h3>
                <input type="text" id="search-input" placeholder="输入菜名或食材...">
            </div>
        </aside>

        <main class="main-content">
            <div class="stats-bar">
                <span id="recipe-count">共 0 道菜谱</span>
                <select id="sort-select">
                    <option value="default">默认排序</option>
                    <option value="name">按名称</option>
                    <option value="difficulty">按难度</option>
                </select>
            </div>

            <div id="recipe-grid" class="recipe-grid">
            </div>
        </main>
    </div>

    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>中华菜谱系统 &copy; 2026 | 传承美食文化，共享烹饪之乐</p>
    </footer>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
